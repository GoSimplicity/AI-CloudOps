name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Release tooling tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify release
        run: |
          go test ./...
          go test -tags=smoke ./internal/app ./internal/middleware ./internal/cron/api ./internal/cron/handler ./internal/cron/scheduler ./internal/cron/executor ./internal/cron/dao ./internal/tree/api ./internal/tree/ssh ./pkg/ssh ./pkg/terminal ./pkg/di
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Package verified source and Linux binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/ai-cloudops-linux-amd64 .
          git archive --format=tar.gz --prefix=ai-cloudops/ HEAD > "dist/ai-cloudops-${RELEASE_TAG}-source.tar.gz"
          cd dist
          sha256sum ai-cloudops-* > SHA256SUMS
      - name: Publish explicit tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Source and Linux amd64 binary passed unit tests, gateway smoke, vet and govulncheck.
            Deployment still requires production secrets, infrastructure configuration and environment acceptance.
            See README.md and docs/release/ for deployment requirements. Verify downloads against SHA256SUMS.
          files: |
            dist/ai-cloudops-*
            dist/SHA256SUMS
