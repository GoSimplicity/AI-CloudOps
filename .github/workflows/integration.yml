name: Three-repository integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: cloudops-ci-${{ github.run_id }}

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: AI-CloudOps
    steps:
      - uses: actions/checkout@v4
        with:
          path: AI-CloudOps
      - name: Read locked secondary source revisions
        id: sources
        run: python3 scripts/integration/locked_sources.py --github-output
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sources.outputs.web }}
          repository: GoSimplicity/AI-CloudOps-web
          path: AI-CloudOps-web
      - uses: actions/checkout@v4
        with:
          repository: GoSimplicity/AI-CloudOps-aiops
          ref: ${{ steps.sources.outputs.aiops }}
          path: AI-CloudOps-aiops
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: AI-CloudOps/go.mod
          cache-dependency-path: AI-CloudOps/go.sum
      - name: Startup migration model registration
        run: go test ./pkg/di -run '^TestStartupRegistersEveryPersistentModel$' -count=1
      - name: Record tested revisions
        run: |
          git rev-parse HEAD
          git -C ../AI-CloudOps-web rev-parse HEAD
          git -C ../AI-CloudOps-aiops rev-parse HEAD
      - name: Cross-repository cloud provider contract
        run: go run scripts/integration/cloud_provider_contract.go ../AI-CloudOps-web
      - name: Generate private isolated configuration
        run: python scripts/release-env.py
      - name: Offline fresh-stack safety regression
        run: python -m unittest scripts.tests.test_release_fresh scripts.tests.test_release_env scripts.tests.test_locked_sources -v
      - name: Explicitly migrate a new owned stack and start with runtime roles
        run: python scripts/release-fresh.py --execute-new-stack --project "$COMPOSE_PROJECT_NAME" --docker-socket /var/run/docker.sock
      - name: Versioned migration engine with owned MySQL fixtures
        run: go test -race -tags=integration ./pkg/schema -count=1 -timeout=180s
      - name: Immutable baseline matches all registered models
        run: go test -race -tags=integration ./internal/dbschema -count=1 -timeout=180s
      - name: Explicit migration CLI with owned MySQL fixtures
        run: go test -race -tags=integration ./cmd/schema -count=1 -timeout=180s
      - name: Isolated MySQL full migration and YAML persistence
        run: python scripts/integration/schema_smoke.py --mysql-migration
      - name: Isolated MySQL notification channel pagination
        run: python scripts/integration/schema_smoke.py --mysql-notification
      - name: Isolated MySQL cloud account region transaction
        run: python scripts/integration/schema_smoke.py --mysql-cloud-account
      - name: Isolated MySQL temporary cloud credentials
        run: python scripts/integration/schema_smoke.py --mysql-cloud-temporary
      - name: Isolated MySQL provider credential migration
        run: python scripts/integration/schema_smoke.py --mysql-cloud-provider-credentials
      - name: Isolated MySQL cloud region transaction and fencing
        run: python scripts/integration/schema_smoke.py --mysql-cloud-region-sync
      - name: Isolated MySQL managed resource reconciliation
        run: python scripts/integration/schema_smoke.py --mysql-cloud-managed
      - name: Isolated MySQL temporary credential full sync
        run: python scripts/integration/schema_smoke.py --mysql-cloud-temporary-full
      - name: Isolated MySQL immutable instance notification scope
        run: python scripts/integration/schema_smoke.py --mysql-instance-source
      - name: Isolated MySQL idempotent notification update
        run: python scripts/integration/schema_smoke.py --mysql-notification-idempotent
      - name: Isolated MySQL notification outbox and delivery
        run: python scripts/integration/schema_smoke.py --mysql-notification-outbox
      - name: Isolated MySQL concurrent inbox delivery
        run: python scripts/integration/schema_smoke.py --mysql-notification-inbox
      - name: Isolated MySQL scheduled notifications
        run: python scripts/integration/schema_smoke.py --mysql-notification-schedule
      - name: Isolated MySQL notification timezone guard
        run: python scripts/integration/schema_smoke.py --mysql-notification-timezone
      - name: Real notification worker with an isolated Redis and local inbox
        run: CLOUDOPS_TEST_NOTIFICATION_ASYNC=true go test -race -tags=integration ./pkg/di -run '^TestNotificationAsyncIsolatedRedis$' -count=1
      - name: Periodic tasks continue after failure is archived
        run: CLOUDOPS_TEST_CRON_ASYNC=true go test -race -tags=integration ./internal/cron/scheduler -run '^TestPeriodicTaskContinuesAfterArchive$' -count=1
      - name: Isolated physical backup and quarantine restore
        run: python scripts/integration/recovery_backup_fixture.py --execute --docker-socket /var/run/docker.sock
      - name: Gateway and session acceptance
        run: python scripts/release-smoke.py --crud
      - name: Real RBAC and workorder lifecycle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          settings = dict(line.split('=', 1) for line in Path('deploy/release/.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          env = {**os.environ, 'BOOTSTRAP_ADMIN_PASSWORD': settings['BOOTSTRAP_ADMIN_PASSWORD']}
          for script, arguments in [('schema_smoke.py', []), ('account_access.py', ['--rbac']), ('workorder_flow.py', [])]:
              subprocess.run(['python', 'scripts/integration/' + script, '--url', 'http://localhost:18080', *arguments], env=env, check=True)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          package_json_file: AI-CloudOps-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: AI-CloudOps-web/pnpm-lock.yaml
      - name: Install browser acceptance dependencies
        working-directory: AI-CloudOps-web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Offline browser gate safety regression
        run: python -m unittest scripts.tests.test_business_browser -v
      - name: Real browser workorder lifecycle and Cron cancellation
        run: python scripts/integration/business_browser.py
        env:
          CLOUDOPS_CI_OWNED_STACK: '1'
      - name: Internal MCP authentication and calculator
        run: docker compose -f deploy/release/compose.yaml exec -T aiops python - < scripts/integration/mcp_smoke.py
      - name: AI proxy permission catalogue matches actual HTTP and WebSocket routes
        run: docker compose -f deploy/release/compose.yaml exec -T aiops python - "$(cat internal/app/aiops_permissions.json)" < scripts/integration/aiops_route_catalog.py
      - name: Service status
        if: always()
        run: docker compose -f deploy/release/compose.yaml ps
      - name: Remove this job's isolated resources
        if: always()
        run: docker compose -f deploy/release/compose.yaml down --volumes --remove-orphans
