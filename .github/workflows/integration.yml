name: Three-repository integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: cloudops-ci-${{ github.run_id }}

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: AI-CloudOps
    steps:
      - uses: actions/checkout@v4
        with:
          path: AI-CloudOps
      - uses: actions/checkout@v4
        with:
          repository: GoSimplicity/AI-CloudOps-web
          path: AI-CloudOps-web
      - uses: actions/checkout@v4
        with:
          repository: GoSimplicity/AI-CloudOps-aiops
          path: AI-CloudOps-aiops
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: AI-CloudOps/go.mod
          cache-dependency-path: AI-CloudOps/go.sum
      - name: Startup migration model registration
        run: go test ./pkg/di -run '^TestStartupRegistersEveryPersistentModel$' -count=1
      - name: Record tested revisions
        run: |
          git rev-parse HEAD
          git -C ../AI-CloudOps-web rev-parse HEAD
          git -C ../AI-CloudOps-aiops rev-parse HEAD
      - name: Generate private isolated configuration
        run: python scripts/release-env.py
      - name: Build and start isolated stack
        run: docker compose -f deploy/release/compose.yaml up -d --build --wait --wait-timeout 300
      - name: Isolated MySQL full migration and YAML persistence
        run: python scripts/integration/schema_smoke.py --mysql-migration
      - name: Isolated MySQL notification channel pagination
        run: python scripts/integration/schema_smoke.py --mysql-notification
      - name: Isolated MySQL cloud account region transaction
        run: python scripts/integration/schema_smoke.py --mysql-cloud-account
      - name: Isolated MySQL immutable instance notification scope
        run: python scripts/integration/schema_smoke.py --mysql-instance-source
      - name: Isolated MySQL idempotent notification update
        run: python scripts/integration/schema_smoke.py --mysql-notification-idempotent
      - name: Real notification worker with an isolated Redis and local inbox
        run: CLOUDOPS_TEST_NOTIFICATION_ASYNC=true go test -race -tags=integration ./pkg/di -run '^TestNotificationAsyncIsolatedRedis$' -count=1
      - name: Periodic tasks continue after failure is archived
        run: CLOUDOPS_TEST_CRON_ASYNC=true go test -race -tags=integration ./internal/cron/scheduler -run '^TestPeriodicTaskContinuesAfterArchive$' -count=1
      - name: Gateway and session acceptance
        run: python scripts/release-smoke.py --crud
      - name: Real RBAC and workorder lifecycle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          settings = dict(line.split('=', 1) for line in Path('deploy/release/.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          env = {**os.environ, 'BOOTSTRAP_ADMIN_PASSWORD': settings['BOOTSTRAP_ADMIN_PASSWORD']}
          for script, arguments in [('schema_smoke.py', []), ('account_access.py', ['--rbac']), ('workorder_flow.py', [])]:
              subprocess.run(['python', 'scripts/integration/' + script, '--url', 'http://localhost:18080', *arguments], env=env, check=True)
          PY
      - name: Internal MCP authentication and calculator
        run: docker compose -f deploy/release/compose.yaml exec -T aiops python - < scripts/integration/mcp_smoke.py
      - name: AI proxy permission catalogue matches actual HTTP and WebSocket routes
        run: docker compose -f deploy/release/compose.yaml exec -T aiops python - "$(cat internal/app/aiops_permissions.json)" < scripts/integration/aiops_route_catalog.py
      - name: Service status
        if: always()
        run: docker compose -f deploy/release/compose.yaml ps
      - name: Remove this job's isolated resources
        if: always()
        run: docker compose -f deploy/release/compose.yaml down --volumes --remove-orphans
