# 可选 Alertmanager 配置（compose profile: alerting）。只把告警转发给内网 webhook 服务。
# bearer token 由 alertmanager-entrypoint.sh 从 WEBHOOK_ALERTMANAGER_BEARER_TOKEN 写到 credentials_file，这里不放真实值。
# 需要 Prometheus 推送告警时，另在 prometheus.yml 增加 alerting.alertmanagers 指向 alertmanager:9093。
route:
  receiver: cloudops-webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: cloudops-webhook
    webhook_configs:
      - url: http://webhook:8889/api/v1/alerts/receive
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/webhook_bearer_token
