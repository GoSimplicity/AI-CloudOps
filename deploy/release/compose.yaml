name: cloudops

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mysql:
    <<: *runtime
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: cloudops
      MYSQL_USER: cloudops
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u cloudops cloudops -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *runtime
    image: redis:7.4.11-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Generate .env first}", --appendonly, "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate .env first}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.2.1
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  backend:
    <<: *runtime
    image: cloudops-backend:${RELEASE_VERSION:-local}
    build:
      context: ../..
    environment:
      ENV: production
      SERVER_PORT: "8889"
      MYSQL_ADDR: cloudops:${MYSQL_PASSWORD:?Generate .env first}@tcp(mysql:3306)/cloudops?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
      JWT_KEY1: ${JWT_KEY1:?Generate .env first}
      JWT_KEY2: ${JWT_KEY2:?Generate .env first}
      JWT_EXPIRATION: "30"
      TREE_PASSWORD_ENCRYPTION_KEY: ${TREE_PASSWORD_ENCRYPTION_KEY:?Generate .env first}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Generate .env first}
      MOCK_ENABLED: "false"
      LOG_LEVEL: info
      AIOPS_BASE_URL: http://aiops:8080
      AIOPS_API_KEY: ${AIOPS_API_KEY:?Generate .env first}
      SERVER_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:18080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8889/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  aiops:
    <<: *runtime
    image: cloudops-aiops:${RELEASE_VERSION:-local}
    build:
      context: ../../../AI-CloudOps-aiops
    environment:
      ENV: production
      AIOPS_API_KEY: ${AIOPS_API_KEY:?Generate .env first}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
      PROMETHEUS_HOST: prometheus:9090
      MCP_SERVER_URL: http://mcp:9000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-32B-Instruct}
    volumes:
      - aiops:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  mcp:
    <<: *runtime
    image: cloudops-aiops:${RELEASE_VERSION:-local}
    command: [python, -m, app.mcp.main, --host, 0.0.0.0, --port, "9000"]
    environment:
      ENV: production
      AIOPS_API_KEY: ${AIOPS_API_KEY:?Generate .env first}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *runtime
    image: cloudops-web:${RELEASE_VERSION:-local}
    build:
      context: ../../../AI-CloudOps-web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      SERVER_PORT: "80"
      SERVER_ROOT: /public
      SERVER_FALLBACK_PAGE: /public/index.html
      VITE_GLOB_API_URL: /api
      VITE_GLOB_AIOPS_URL: /api/v1

  gateway:
    <<: *runtime
    image: nginx:1.28-alpine
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18080}:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      aiops:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql:
  redis_data:
  prometheus:
  aiops:
