resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream cloudops_api {
    zone cloudops_api 64k;
    server backend:8889 resolve;
}

upstream cloudops_frontend {
    zone cloudops_frontend 64k;
    server web:80 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://cloudops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://cloudops_api/health;
    }

    location / {
        proxy_pass http://cloudops_frontend;
        proxy_set_header Host $host;
    }
}
