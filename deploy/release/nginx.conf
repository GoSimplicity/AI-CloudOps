resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

# 只记录路径，不把历史 WebSocket 查询令牌或请求头写入访问日志
log_format cloudops '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

upstream cloudops_api {
    zone cloudops_api 64k;
    server backend:8889 resolve;
}

upstream cloudops_frontend {
    zone cloudops_frontend 64k;
    server web:80 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 只限制登录接口。本文件由 conf.d 引入，zone 位于 http 上下文。
# 每个来源 IP 平均 1 次/秒，允许突发 5 次，超出直接 429。
limit_req_zone $binary_remote_addr zone=cloudops_login:1m rate=1r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log cloudops;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/user/login {
        limit_req zone=cloudops_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cloudops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://cloudops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 10s;
    }

    location = /ready {
        proxy_pass http://cloudops_api/ready;
    }

    location = /health {
        proxy_pass http://cloudops_api/health;
    }

    location / {
        proxy_pass http://cloudops_frontend;
        proxy_set_header Host $http_host;
    }
}
