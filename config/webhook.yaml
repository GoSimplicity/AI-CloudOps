webhook:
  common_map_renew_interval_seconds: 10  # 通用映射刷新间隔（秒）
  alert_manager_api: "http://localhost:9093"  # 告警管理 API
  default_upgrade_minutes: 30
  front_domain: "http://localhost:3000"  # 前端地址，含 scheme
  backend_domain: "http://localhost:8889/api/v1/alerts"  # 飞书卡片操作链接的对外地址，含 scheme 和 /api/v1/alerts。生产或无法识别的 ENV 拒绝回环主机、未指定地址和无法解析的 URL
  action_signing_key: ""  # 由 WEBHOOK_ACTION_SIGNING_KEY 注入。生产或无法识别的 ENV 下为空会拒绝启动
  alertmanager_bearer_token: ""  # 由 WEBHOOK_ALERTMANAGER_BEARER_TOKEN 注入。生产或无法识别的 ENV 下为空会拒绝启动
  im_feishu:
    group_message_api: "https://open.feishu.cn/open-apis/bot/v2/hook"  # 群聊消息 API
    tenant_access_token_api: "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal"  # 租户访问令牌 API
    private_robot_app_id: ""
    private_robot_app_secret: ""
    request_timeout_seconds: 10  # 请求超时时间（秒）
  port: "8889"  # HTTP 服务端口
mysql:
  addr: "" # 敏感信息，不写入配置文件；由环境变量 WEBHOOK_MYSQL_ADDR 注入完整 DSN（必需，缺失时 webhook 启动即失败）
