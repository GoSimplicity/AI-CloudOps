server:
  port: "8889"
log:
  dir: "./logs"
  level: "warn"
jwt:
  key1: "" # 敏感信息，不写入配置文件；由环境变量 JWT_KEY1 注入（必需）
  key2: "" # 敏感信息，不写入配置文件；由环境变量 JWT_KEY2 注入（必需）
  issuer: "" # 不写入配置文件；由环境变量 JWT_ISSUER 注入（必需，须与已签发令牌的 iss 一致）
  expiration: 3600
redis:
  addr: "redis:6379"
  password: "" # 敏感信息，不写入配置文件；由环境变量 REDIS_PASSWORD 注入（可选）
mysql:
  addr: "" # 敏感信息，不写入配置文件；由环境变量 MYSQL_ADDR 注入（必需）
tree:
  check_status_cron: "@every 300s"
  password_encryption_key: "" # 敏感信息，不写入配置文件；由环境变量 TREE_PASSWORD_ENCRYPTION_KEY 注入（必需）
k8s:
  refresh_cron: "@every 300s"
prometheus:
  refresh_cron: "@every 15s"
  enable_alert: 0 # 1 开启告警 0 关闭告警
  enable_record: 0 # 1 开启记录 0 关闭记录
  alert_webhook_addr: "http://localhost:8889/api/v1/alerts/receive"
  alert_webhook_file_dir: "/tmp/webhook_files"
  httpSdAPI: "http://localhost:8889/api/not_auth/getTreeNodeBindIps"
mock:
  enabled: false # 是否开启mock
notification:
  # 邮箱配置
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 587
    username: "" # 敏感信息，不写入配置文件；由环境变量 NOTIFICATION_EMAIL_USERNAME 注入（启用邮件时必需）
    password: "" # 敏感信息，不写入配置文件；由环境变量 NOTIFICATION_EMAIL_PASSWORD 注入（启用邮件时必需）
    from_name: "AI-CloudOps"
    max_retries: 3
    retry_interval: "5m"
    timeout: "30s"
    use_tls: true
  # 飞书配置
  feishu:
    enabled: false
    app_id: "" # 敏感信息，不写入配置文件；由环境变量 NOTIFICATION_FEISHU_APP_ID 注入（启用飞书时必需）
    app_secret: "" # 敏感信息，不写入配置文件；由环境变量 NOTIFICATION_FEISHU_APP_SECRET 注入（启用飞书时必需）
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/"
    private_message_api: "https://open.feishu.cn/open-apis/im/v1/messages"
    tenant_access_token_api: "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal"
    max_retries: 3
    retry_interval: "5m"
    timeout: "10s"
